name: 'OneSky Translation Sync'
description: 'Automatically sync translations with OneSky platform'
author: 'OneSky'

branding:
  icon: 'globe'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm install
    
    - name: Sync translations
      id: sync
      shell: bash
      run: |
        # Run the sync script
        node ${{ github.action_path }}/sync-translations.js
    
    - name: Create Pull Request
      id: pr
      if: steps.sync.outputs.has-changes == 'true' && steps.sync.outputs.create-pr == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ github.token }}
        branch: ${{ steps.sync.outputs.pr-branch-prefix }}-${{ github.run_number }}
        title: ${{ steps.sync.outputs.pr-title }}
        body: |
          This PR contains updated translations from OneSky.
          
          **Updated languages:** ${{ steps.sync.outputs.updated-languages }}
          
          **Changes:**
          - Synced translations from OneSky platform
          - Configuration: .oneskyapp.yml
          
          **Translation status:**
          ✅ Translations downloaded and processed successfully
          
          ---
          
          *Auto-generated by [OneSky Translation Action](https://github.com/onesky/translation-action)*
          
          Run ID: ${{ github.run_id }}
          Commit: ${{ github.sha }}
        commit-message: "feat: update translations from OneSky"
        author: "onesky-bot <bot@onesky.io>"
        reviewers: ${{ github.actor }} 
